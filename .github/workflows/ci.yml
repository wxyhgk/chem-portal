name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端 / 计算层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（只装契约生成需要的，不装 rdkit/xtb）
        run: pip install "pydantic>=2" annotated-types

      - name: 语法检查
        run: python -m compileall -q backend compute scripts shared tests

      - name: 契约一致性 — job.ts 必须由 job.py 生成
        run: python -m scripts.gen_ts --check
        env:
          PYTHONPATH: .

      - name: 前后端 shared 副本未漂移
        run: bash web/scripts/sync-shared.sh --check

      - name: 几何分析冒烟测试
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: .

  web:
    name: 前端
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci

      - name: 缓存 Next 构建产物
        uses: actions/cache@v4
        with:
          path: web/.next/cache
          # 依赖变了就重建缓存；源码变了在旧缓存上增量构建
          key: next-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/app/**', 'web/lib/**', 'web/shared/**', 'web/*.ts', 'web/*.mjs', 'web/*.js') }}
          restore-keys: |
            next-${{ hashFiles('web/package-lock.json') }}-

      - name: 类型检查
        working-directory: web
        run: npx tsc --noEmit

      - name: 生产构建
        working-directory: web
        run: npx next build
        env:
          NODE_ENV: production
          # 生产必须走同源 /api 代理（见 middleware.ts），这里保持为空防止误配
          NEXT_PUBLIC_API_URL: ""
