<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chem Portal - 在线计算</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.1.0/3Dmol-min.js"></script>
<style>body{font-family:system-ui;padding:24px;max-width:1000px;margin:auto}textarea{width:100%;height:160px;font-family:monospace}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left}button{padding:8px 16px}select{padding:6px}#viewer{width:100%;height:400px;position:relative;border:1px solid #ddd;margin:8px 0}.viewer-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.controls{margin:6px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}</style>
</head>
<body>
<h1>Chem Portal <small style="color:#666">24核法国VPS · xtb GFN2 + 3Dmol.js</small></h1>
<div id="warn" style="background:#fff3cd;padding:8px;border:1px solid #ffc107;display:none"></div>
<h3>提交任务</h3>
<textarea id="xyz">3
H2O
O 0 0 0
H 0.9 0 0.5
H -0.9 0 0.5
</textarea>
<div style="margin:8px 0">
任务 <select id="task"><option value="sp">单点能 (sp)</option><option value="opt" selected>几何优化 (opt)</option></select>
charge <input id="charge" type="number" value="0" style="width:60px">
threads <input id="threads" type="number" value="8" style="width:60px">
<button onclick="submitJob()">提交计算</button> <span id="msg"></span>
</div>
<h3>任务列表 <button onclick="loadJobs()">刷新</button></h3>
<table><thead><tr><th>id</th><th>任务</th><th>status</th><th>energy</th><th>wall</th><th>time</th></tr></thead><tbody id="tbody"></tbody></table>

<div class="viewer-wrap">
<div>
<h4>3D 结构</h4>
<div id="viewer"></div>
<div class="controls">
<button onclick="playAnim()">▶ 播放</button><button onclick="pauseAnim()">⏸ 暂停</button><button onclick="stopAnim()">⏹ 重置</button>
<label>速度 <input id="speed" type="range" min="80" max="800" value="250" oninput="updateSpeed()"></label>
<label>帧 <input id="frameSlider" type="range" min="0" max="0" value="0" oninput="seekFrame(this.value)" style="width:120px"><span id="frameLabel">0/0</span></label>
</div>
<div id="viewerStatus" style="font-size:12px;color:#888"></div>
<div id="err" style="font-size:12px;color:#c00;white-space:pre-wrap"></div>
</div>
<div>
<h4>XYZ 文本 <button onclick="downloadXYZ()">下载轨迹</button> <button onclick="toggleXYZ()">切换输入/优化</button></h4>
<pre id="xyzout" style="background:#eef;padding:12px;white-space:pre-wrap;max-height:380px;overflow:auto"></pre>
</div>
</div>
<pre id="log" style="background:#f6f6f6;padding:12px;white-space:pre-wrap;max-height:300px;overflow:auto"></pre>
<script>
let cur=null, showOpt=true, viewer=null, totalFrames=0, curFrame=0, timer=null;
function warn(m){ const w=document.getElementById('warn'); w.style.display='block'; w.textContent=m; }
function status(m){ document.getElementById('viewerStatus').textContent=m; }
function err(m){ document.getElementById('err').textContent=m; }
function initViewer(){
  if(typeof $3Dmol==='undefined'){ warn('3Dmol.js 未加载，请检查网络或刷新'); status('3Dmol 未加载'); return; }
  try{
    viewer = $3Dmol.createViewer("viewer", {backgroundColor:"white"});
    status('viewer 就绪'); err('');
    renderXYZ(document.getElementById('xyz').value, false);
  }catch(e){ err('初始化失败: '+e); }
}
function countFrames(txt){
  if(!txt) return 0;
  // 统计 xyz 帧数：每帧以 "数字\\n" 开头
  const lines=txt.trim().split('\n');
  let c=0;
  for(let i=0;i<lines.length;i++){
    if(/^\s*\d+\s*$/.test(lines[i]) && i+1<lines.length){
      c++;
      // 跳过该帧
      const n=parseInt(lines[i].trim());
      i+= n+1; // atom count + comment + n atoms
    }
  }
  return c||1;
}
function renderXYZ(xyzText, autoPlay){
  if(!viewer) return;
  clearInterval(timer); timer=null; curFrame=0;
  viewer.clear();
  if(!xyzText || xyzText.trim().length<5){ viewer.render(); document.getElementById('frameLabel').textContent='0/0'; return; }
  totalFrames = countFrames(xyzText);
  document.getElementById('frameSlider').max = Math.max(0, totalFrames-1);
  document.getElementById('frameSlider').value = 0;
  document.getElementById('frameLabel').textContent = '1/' + totalFrames;
  try{
    // 优先用 addModelsAsFrames 支持多帧
    if(viewer.addModelsAsFrames){
      viewer.addModelsAsFrames(xyzText, "xyz");
    } else {
      viewer.addModel(xyzText, "xyz");
    }
  }catch(e){ err('解析 xyz 失败: '+e+'\n'+xyzText.slice(0,200)); return; }
  viewer.setStyle({}, {stick:{radius:0.12}, sphere:{scale:0.23}});
  viewer.zoomTo();
  viewer.setFrame(0);
  viewer.render();
  status('已加载 '+(autoPlay?'轨迹':'模型')+' 共'+totalFrames+'帧');
  err('');
  if(autoPlay && totalFrames>1){
    setTimeout(()=>playAnim(), 300);
  }
}
function playAnim(){
  if(!viewer) return;
  if(totalFrames<=1){ status('单帧无需播放'); return; }
  clearInterval(timer);
  const interval=parseInt(document.getElementById('speed').value);
  status('播放中 '+interval+'ms/帧');
  timer=setInterval(()=>{
    curFrame=(curFrame+1)%totalFrames;
    try{ viewer.setFrame(curFrame); viewer.render(); }catch(e){ err('setFrame失败: '+e); clearInterval(timer); }
    document.getElementById('frameSlider').value=curFrame;
    document.getElementById('frameLabel').textContent=(curFrame+1)+'/'+totalFrames;
  }, interval);
}
function pauseAnim(){ clearInterval(timer); timer=null; status('已暂停 @'+(curFrame+1)+'/'+totalFrames); }
function stopAnim(){ clearInterval(timer); timer=null; curFrame=0; if(viewer){ try{ viewer.setFrame(0); viewer.render(); }catch(e){} } document.getElementById('frameSlider').value=0; document.getElementById('frameLabel').textContent='1/'+totalFrames; status('已重置'); }
function seekFrame(v){ curFrame=parseInt(v); if(viewer){ try{ viewer.setFrame(curFrame); viewer.render(); }catch(e){} document.getElementById('frameLabel').textContent=(curFrame+1)+'/'+totalFrames; } }
function updateSpeed(){ if(timer) playAnim(); }
function toggleXYZ(){
  if(!cur) return;
  showOpt = !showOpt;
  const txt = showOpt ? (cur.result_xyz||cur.input_xyz||'') : (cur.input_xyz||'');
  document.getElementById('xyzout').textContent = txt.slice(0,8000);
  renderXYZ(txt, false);
}
async function submitJob(){
  const xyz=document.getElementById('xyz').value;
  const charge=parseInt(document.getElementById('charge').value||0);
  const threads=parseInt(document.getElementById('threads').value||8);
  const task=document.getElementById('task').value;
  const r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({xyz,charge,threads,task})});
  const j=await r.json();
  document.getElementById('msg').textContent='已提交 '+j.id+' ('+task+')';
  loadJobs();
  setTimeout(()=>show(j.id),1500);
}
async function loadJobs(){
  const r=await fetch('/api/jobs'); const js=await r.json();
  const tb=document.getElementById('tbody'); tb.innerHTML='';
  js.forEach(j=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><a href="#" onclick="show('${j.id}');return false">${j.id}</a></td><td>${j.task||'sp'}</td><td>${j.status}</td><td>${j.result_energy??''}</td><td>${j.wall_time?j.wall_time.toFixed(2)+'s':''}</td><td>${j.created_at}</td>`;
    tb.appendChild(tr);
  });
}
async function show(id){
  const r=await fetch('/api/jobs/'+id); const j=await r.json(); cur=j; showOpt=true;
  document.getElementById('log').textContent=JSON.stringify({id:j.id,task:j.task,status:j.status,result_energy:j.result_energy,wall_time:j.wall_time},null,2)+'\n\n'+(j.result_log||'').slice(-2000);
  const txt = j.result_xyz || j.input_xyz || '';
  document.getElementById('xyzout').textContent = txt.slice(0,8000);
  renderXYZ(txt, j.task==='opt' && countFrames(txt)>1);
}
function downloadXYZ(){
  if(!cur) return;
  const txt = cur.result_xyz || cur.input_xyz;
  if(!txt) return;
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=cur.id+'_'+(cur.task||'sp')+'.xyz'; a.click();
}
window.addEventListener('load', ()=>{ setTimeout(initViewer, 600); });
document.getElementById('xyz').addEventListener('input', e=>renderXYZ(e.target.value, false));
setTimeout(()=>{ if(typeof $3Dmol==='undefined') warn('3Dmol.js 加载超时，请刷新'); }, 4000);
loadJobs(); setInterval(loadJobs,3000);
</script>
</body></html>
